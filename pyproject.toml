[project]
name = "poker-ai"
version = "0.1.0"
description = "Open source implementation of a CFR based poker AI player"
authors = [
    { name = "Leon Fedden", email = "leonfedden@gmail.com" },
    { name = "Colin Manko" }
]
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["poker", "ai", "machine-learning", "counterfactual-regret", "game-theory"]

dependencies = [
    "blessed>=1.20.0",
    "click>=8.1.7",
    "dill>=0.3.8",
    "enlighten>=1.12.4",
    "ipdb>=0.13.13",
    "matplotlib>=3.8.2",
    "numpy>=1.26.3",
    "pandas>=2.1.4",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.4",
    "tqdm>=4.66.1",
    "flask>=3.0.0",
    "flask-socketio>=5.3.6",
    "python-socketio>=5.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.11",
    "mypy>=1.8.0",
    "black>=23.12.1",
    "isort>=5.13.2",
]
docs = [
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=2.0.0",
    "recommonmark>=0.7.1",
]

[project.scripts]
poker_ai = "poker_ai.cli.runner:cli"

[project.urls]
Homepage = "https://github.com/fedden/poker_ai"
Repository = "https://github.com/fedden/poker_ai.git"
Issues = "https://github.com/fedden/poker_ai/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poker_ai"]

[tool.hatch.build.targets.sdist]
include = [
    "/poker_ai",
    "/tests",
    "/README.md",
    "/HISTORY.md",
    "/LICENSE",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.11",
    "mypy>=1.8.0",
    "black>=23.12.1",
    "isort>=5.13.2",
    "ipython>=8.19.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["ARG"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["test"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=poker_ai",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
    "functional: marks tests as functional tests",
]

[tool.coverage.run]
source = ["poker_ai"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true