name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  PYTHON_VERSION: '3.12'
  ZIG_VERSION: '0.13.0'

jobs:
  # Build and test Python package
  build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools twine

      - name: Build Python package
        run: |
          python -m build

      - name: Verify package
        run: |
          twine check dist/*
          pip install dist/*.whl
          python -c "import poker_ai; print('Package imports successfully')"

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v3
        with:
          name: python-package
          path: dist/

  # Cross-compile Zig binaries
  build-zig:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            name: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-linux-gnu
            name: linux-aarch64
          - os: macos-latest
            target: x86_64-macos-none
            name: macos-x86_64
          - os: macos-latest
            target: aarch64-macos-none
            name: macos-aarch64
          - os: ubuntu-latest
            target: x86_64-windows-gnu
            name: windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install sqlite

      - name: Build Zig binary
        run: |
          cd poker_ai/zig_clustering
          mkdir -p ../../dist/zig-${{ matrix.name }}
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast --prefix=../../dist/zig-${{ matrix.name }}

      - name: Test binary (native targets only)
        if: |
          (matrix.name == 'linux-x86_64' && matrix.os == 'ubuntu-latest') ||
          (matrix.name == 'macos-x86_64' && matrix.os == 'macos-latest')
        run: |
          binary_name="poker_clustering"
          if [[ "${{ matrix.name }}" == *"windows"* ]]; then
            binary_name="poker_clustering.exe"
          fi
          dist/zig-${{ matrix.name }}/bin/$binary_name --help

      - name: Upload Zig binary
        uses: actions/upload-artifact@v3
        with:
          name: zig-${{ matrix.name }}
          path: dist/zig-${{ matrix.name }}/

  # Build Docker images
  build-docker:
    runs-on: ubuntu-latest
    needs: [build-python, build-zig]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            pokerai/poker-ai
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Zig-only image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.zig
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: pokerai/poker-clustering:${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push hybrid image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.hybrid
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Performance benchmarks
  benchmark:
    runs-on: ubuntu-latest
    needs: [build-python, build-zig]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download Python artifacts
        uses: actions/download-artifact@v3
        with:
          name: python-package
          path: dist/

      - name: Download Zig artifacts
        uses: actions/download-artifact@v3
        with:
          name: zig-linux-x86_64
          path: zig-bin/

      - name: Install and benchmark
        run: |
          pip install dist/*.whl
          chmod +x zig-bin/bin/poker_clustering
          
          # Run basic performance tests
          echo "=== Python Package Performance ==="
          python -c "
          import time
          import poker_ai
          start = time.time()
          # Add basic performance test here
          print(f'Import time: {time.time() - start:.3f}s')
          "
          
          echo "=== Zig Binary Performance ==="
          time zig-bin/bin/poker_clustering --help
          
          # Memory usage test
          echo "=== Memory Usage ==="
          /usr/bin/time -v zig-bin/bin/poker_clustering --help 2>&1 | grep "Maximum resident set size"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: benchmark-results.txt

  # Create GitHub release
  release:
    runs-on: ubuntu-latest
    needs: [build-python, build-zig, build-docker, benchmark]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          
          # Copy Python packages
          cp python-package/* release-assets/
          
          # Organize Zig binaries
          for dir in zig-*/; do
            if [ -d "$dir" ]; then
              target=$(echo "$dir" | sed 's/zig-//' | sed 's/\///')
              mkdir -p "release-assets/binaries/$target"
              cp -r "$dir"/* "release-assets/binaries/$target/"
            fi
          done
          
          # Create cross-platform package
          cd release-assets/binaries
          tar -czf ../poker-clustering-cross-platform.tar.gz *
          cd ../..
          
          # Generate checksums
          cd release-assets
          sha256sum * > SHA256SUMS
          sha256sum binaries/*/* >> SHA256SUMS
          cd ..

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cat > release-notes.md << EOF
          # Poker AI Release $VERSION
          
          ## What's New
          
          See [HISTORY.md](HISTORY.md) for detailed changelog.
          
          ## Installation
          
          ### Python Package
          \`\`\`bash
          pip install poker-ai-*.whl
          \`\`\`
          
          ### Zig Clustering Binary
          Download the appropriate binary for your platform from the assets below.
          
          ### Docker Images
          \`\`\`bash
          # Full Python + Zig environment
          docker pull pokerai/poker-ai:$VERSION
          
          # Zig clustering only
          docker pull pokerai/poker-clustering:$VERSION
          \`\`\`
          
          ## Performance
          
          - Container startup time: < 1 second
          - Memory usage: < 500MB idle
          - Binary size: < 10MB per platform
          
          ## Checksums
          
          See SHA256SUMS file for artifact verification.
          EOF
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release-notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.release_notes.outputs.notes }}
          files: |
            release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to PyPI
  publish-pypi:
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v3
        with:
          name: python-package
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          repository-url: https://upload.pypi.org/legacy/