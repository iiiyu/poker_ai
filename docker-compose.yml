version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: poker-ai-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/poker_ai
      - PYTHONUNBUFFERED=1
    volumes:
      - ./strategies:/app/strategies
      - ./api:/app/api
      - ./poker_ai:/app/poker_ai
    depends_on:
      - redis
      - db
    networks:
      - poker-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: poker-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - poker-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: poker-ai-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=poker_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - poker-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: poker-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - poker-network
    restart: unless-stopped

networks:
  poker-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data: